services:
  - type: web
    name: precificacao3d-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate && npx tsx src/db/seed.ts
    startCommand: npx tsx src/server.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: precificacao3d-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://precificacao3d-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
